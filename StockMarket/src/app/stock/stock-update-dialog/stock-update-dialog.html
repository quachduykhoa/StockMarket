<dialog #dialog class="update-dialog" (close)="closed.emit()">
	@if (stock) {
		<div class="dialog-header">
			<h3>
				Update Stock
				<span class="code">{{ stock.code }}</span>
			</h3>
			<button type="button" class="close-btn" (click)="close()" title="Close">×</button>
		</div>

		@if (message) {
			<p class="message" [class.error]="messageType === 'error'">{{ message }}</p>
		}

		<form class="dialog-body" [formGroup]="stockForm" (ngSubmit)="save()">
			<label class="field">
				<span>Stock Name *</span>
				<input 
					type="text"
					formControlName="name"
					placeholder="Stock Name"
					[class.invalid]="isInvalid('name')"
				/>
			</label>

			<label class="field">
				<span>Price *</span>
				<input
					type="number"
					formControlName="price"
					placeholder="Price"
					[class.invalid]="isInvalid('price')"
				/>
			</label>

			<label class="field">
				<span>Previous Price *</span>
				<input
					type="number"
					formControlName="previousPrice"
					placeholder="Previous Price"
					[class.invalid]="isInvalid('previousPrice')"
				/>
			</label>

			<label class="field">
				<span>Exchange *</span>
				<select formControlName="exchange" [class.invalid]="isInvalid('exchange')">
					<option value="NYSE">NYSE</option>
					<option value="NASDAQ">NASDAQ</option>
					<option value="OTHER">OTHER</option>
				</select>
			</label>

			<div class="actions">
				<button type="button" class="cancel" (click)="close()">Cancel</button>
				<button type="submit" class="primary" [disabled]="stockForm.invalid">
					Save
				</button>
			</div>
		</form>
	}
</dialog>
