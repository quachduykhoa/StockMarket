<main class="market">
	<header class="market-heading">
		<div>
			<p class="eyebrow">Market overview</p>
			<h1>Stock Market App</h1>
		</div>
		<p class="stock-count">{{ filteredStocks.length }} stocks</p>
	</header>

	<div class="toolbar">
		<input
			type="text"
			class="search-box"
			placeholder="Search by name, code or exchange..."
			[(ngModel)]="searchTerm"
		/>
	</div>

	<section class="listview">
		<div class="list-header">
			<span>Name</span>
			<span>Exchange</span>
			<span>Price</span>
			<span class="actions-label">Actions</span>
		</div>

		<ul class="stock-list">
			@for (stock of filteredStocks; track stock.code) {
				<li>
					<app-stock-item
						[stock]="stock" 
						(favoriteChange)="toggleFavorite(stock)"
						(detail)="openDetail(stock)"
						(update)="openUpdate(stock)"
						(remove)="deleteStock(stock)"
					/>
				</li>
			}
		</ul>

		@if (filteredStocks.length === 0) {
			<p class="empty-state">No stock matches "{{ searchTerm }}"</p>
		}
	</section>

	<section class="create-section">
		<app-create-stock-form />
	</section>

	@if (selectedStock) {
		<app-stock-detail-dialog
			[stock]="selectedStock"
			(closed)="selectedStock = null"
		/>
	}

	@if (stockToUpdate) {
		<app-stock-update-dialog
			[stock]="stockToUpdate"
			(closed)="stockToUpdate = null"
		/>
	}
</main>
