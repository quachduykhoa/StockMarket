<div class="stock-container" routerLink="/stock/{{ stock.code }}">
	<div class="name">
		{{ stock.name }}
		<span class="code">{{ stock.code | uppercase }}</span>
	</div>

	<div class="exchange">{{ stock.exchange || 'OTHER' }}</div>

	<div class="price"
		[class.positive]="stock.price >= stock.previousPrice"
		[class.negative]="stock.price < stock.previousPrice">
		{{ stock.price | currency:'USD' }}
	</div>

	<div class="actions">
		<button type="button" (click)="$event.stopPropagation(); toggleFavorite()"
			[class.favorite-active]="stock.favorite">
			{{ stock.favorite ? 'Remove from Favorite' : 'Add to Favorite' }}
		</button>

        <button type="button" class="btn-detail" (click)="$event.stopPropagation(); showDetail()">
			Detail
		</button>

		<button type="button" class="btn-update" (click)="$event.stopPropagation(); showUpdate()">
			Update
		</button>

        <button type="button" class="btn-delete" (click)="$event.stopPropagation(); removeStock()">
			Delete
		</button>
	</div>
</div>
