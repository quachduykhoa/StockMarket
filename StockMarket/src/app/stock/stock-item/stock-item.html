<div class="stock-container">
	<div class="name">
		{{ stock.name }}
		<span class="code">{{ stock.code }}</span>
	</div>

	<div class="exchange">{{ stock.exchange || 'OTHER' }}</div>

	<div class="price"
		[class.positive]="stock.isPositiveChange()"
		[class.negative]="!stock.isPositiveChange()">
		$ {{ stock.price }}
	</div>

	<div class="actions">
		<button type="button" (click)="toggleFavorite()"
			[class.favorite-active]="stock.favorite">
			{{ stock.favorite ? 'Remove from Favorite' : 'Add to Favorite' }}
		</button>
		
        <button type="button" class="btn-detail" (click)="showDetail()">
			Detail
		</button>

		<button type="button" class="btn-update" (click)="showUpdate()">
			Update
		</button>

        <button type="button" class="btn-delete" (click)="removeStock()">
			Delete
		</button>   
	</div>
</div>
