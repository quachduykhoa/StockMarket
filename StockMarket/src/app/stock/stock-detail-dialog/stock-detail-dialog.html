<dialog #dialog class="detail-dialog" (close)="closed.emit()">
	@if (stock) {
		<div class="detail-header">
			<h3>
				{{ stock.name }}
				<span class="code">{{ stock.code }}</span>
			</h3>
			<button type="button" class="close-btn" (click)="close()" title="Close">×</button>
		</div>

		<dl class="detail-body">
			<div class="row">
				<dt>Code</dt>
				<dd>{{ stock.code }}</dd>
			</div>
			<div class="row">
				<dt>Exchange</dt>
				<dd>{{ stock.exchange || 'OTHER' }}</dd>
			</div>
			<div class="row">
				<dt>Price</dt>
				<dd>${{ stock.price }}</dd>
			</div>
			<div class="row">
				<dt>Previous Price</dt>
				<dd>${{ stock.previousPrice }}</dd>
			</div>
			<div class="row">
				<dt>Change</dt>
				<dd [class.positive]="stock.price >= stock.previousPrice"
					[class.negative]="stock.price < stock.previousPrice">
					{{ changePercent() }}%
				</dd>
			</div>
			<div class="row">
				<dt>Favorite</dt>
				<dd>{{ stock.favorite ? '★ Yes' : '☆ No' }}</dd>
			</div>
		</dl>
	}
</dialog>
